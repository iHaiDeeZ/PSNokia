#
# Desktop test build of the C interpreter VM, built with MSYS2 MinGW gcc.
# Used to bring up the 64-bit VM on a PC before moving it to the PS4.
#
#   PC_BITS=32 (default): 32-bit reference build (/mingw32)
#   PC_BITS=64          : 64-bit build (/mingw64), heap kept below 4GB
#
# Host tools (romgen) are always 32-bit, so the ROM image keeps the 32-bit
# object layout that the 64-bit VM also uses.
#

export ENABLE_C_INTERPRETER             := true
export ENABLE_C_INTERPRETER__BY         := pc_c.cfg
export ENABLE_INTERPRETER_GENERATOR     := false
export ENABLE_INTERPRETER_GENERATOR__BY := pc_c.cfg
export ENABLE_COMPILER                  := false
export ENABLE_COMPILER__BY              := pc_c.cfg

ifndef PC_BITS
PC_BITS = 32
endif

host_os   = cygwin
host_arch = i386
os_family = win32
compiler  = gcc
arch      = c

# MakeDeps only defaults iarch when it is empty, but the generated platform
# file pads it with spaces; name it explicitly.
iarch     = c

# The win32 default (WinGammaPlatform) puts all includes in a Visual C++
# precompiled header and leaves the per-file .incl files empty; gcc needs
# the per-file ones.
MakeDepsMain_win32_gcc = UnixPlatform

ifeq ($(PC_BITS), 64)
# The VM expects the ROM TEXT segments to be adjacent in memory. On 64-bit
# hosts the ROM arrays holding pointers are initialized at startup, which
# moves some of them to other sections; one unsegmented block avoids that.
# Set for romgen and target alike - both must agree.
export ENABLE_SEGMENTED_ROM_TEXT_BLOCK     := false
export ENABLE_SEGMENTED_ROM_TEXT_BLOCK__BY := pc_c.cfg
endif

# 32-bit host tools need the 32-bit runtime DLLs first on PATH
export PATH := /mingw32/bin:$(PATH)
GCC_PREFIX_i386 = /mingw32/bin/

ifeq ($(IsTarget), true)
    # BSDSocket.cpp uses Winsock (jvm.make only adds it for the host tools)
    LINK_FLAGS += -lws2_32
ifeq ($(PC_BITS), 64)
    target_arch        = x86_64
    GCC_PREFIX_x86_64  = /mingw64/bin/
    # Load the program at 0x400000 without ASLR - where the PS4 loads its
    # eboot - so code, globals and the ROM image fit in 4-byte VM words.
    LINK_FLAGS += -Wl,--image-base=0x400000 -Wl,--disable-dynamicbase                   -Wl,--disable-high-entropy-va
endif
endif

# The generated ROM image stores 32-bit patterns such as 0xBFF00026 in
# int arrays; modern g++ rejects that as narrowing by default.
CPP_DEF_FLAGS += -Wno-narrowing

# Static link, so the VM runs without either MinGW's DLL directory on PATH
LINK_FLAGS += -static

# jvm.make adds the C interpreter's GlobalDefinitions_c separately, which
# needs its own per-file include list - merged builds don't write one.
MERGE_SOURCE_FILES  = false
