#
# PS4 build of the C interpreter VM (OpenOrbis toolchain, clang for
# x86_64 FreeBSD ELF). The VM is 64-bit with 4-byte heap words - see
# narrow<T> in GlobalDefinitions.hpp.
#
# Host tools (romgen) are 32-bit MinGW builds, as in pc_c, so the ROM
# image keeps the 32-bit object layout the PS4 VM also uses.
#
# GNU_TOOLS_DIR must point at the gcc-style clang wrappers
# (ps4/toolchain).
#

export ENABLE_C_INTERPRETER             := true
export ENABLE_C_INTERPRETER__BY         := ps4_c.cfg
export ENABLE_INTERPRETER_GENERATOR     := false
export ENABLE_INTERPRETER_GENERATOR__BY := ps4_c.cfg
export ENABLE_COMPILER                  := false
export ENABLE_COMPILER__BY              := ps4_c.cfg

# The ROM TEXT segments must be adjacent in memory; with 64-bit startup
# initialization of the ROM arrays they may not be. Romgen and target alike.
export ENABLE_SEGMENTED_ROM_TEXT_BLOCK     := false
export ENABLE_SEGMENTED_ROM_TEXT_BLOCK__BY := ps4_c.cfg

host_os   = cygwin
host_arch = i386
compiler  = gcc
arch      = c

# MakeDeps only defaults iarch when it is empty, but the generated platform
# file pads it with spaces; name it explicitly.
iarch     = c

# Per-file .incl lists (the win32 default writes one Visual C++ PCH instead)
MakeDepsMain_win32_gcc = UnixPlatform

# 32-bit host tools need the 32-bit runtime DLLs first on PATH
export PATH := /mingw32/bin:$(PATH)
GCC_PREFIX_i386 = /mingw32/bin/

ifeq ($(IsTarget), true)
    os_family          = ps4
    target_arch        = x86_64
    GCC_PREFIX_x86_64  = $(GNU_TOOLS_DIR)/bin/
    export ENABLE_TIMER_THREAD     := true
    export ENABLE_TIMER_THREAD__BY := ps4_c.cfg
    # MIDP needs the VM built on PCSL (pcsl/output/ps4_c, build_pcsl_ps4.sh)
    export ENABLE_PCSL             := true
    export ENABLE_PCSL__BY         := ps4_c.cfg
    CPP_DEF_FLAGS += -DPS4
    # lowheap.h and psn_log.h, and the low heap: linked as objects (not an
    # archive) so its malloc replaces libc's (see lowheap_malloc.c)
    # PSNOKIA_PS4 (the repository's ps4/ directory) and PSNOKIA_OUT (build
    # output) come from ps4/build_cldc.sh, which also compiles these objects
    PS4_COMMON     = $(PSNOKIA_PS4)/common
    CPP_DEF_FLAGS += -I$(PS4_COMMON)
    # ps4_stat_fix.o: stat/fstat/lstat with the kernel's real struct layout
    LINK_FLAGS    += $(PSNOKIA_OUT)/common/lowheap.o \
                     $(PSNOKIA_OUT)/common/lowheap_malloc.o \
                     $(PSNOKIA_OUT)/common/ps4_stat_fix.o
else
    os_family          = win32
    # BSDSocket.cpp uses Winsock in the host tools
    LINK_FLAGS += -static
endif

# The generated ROM image stores 32-bit patterns such as 0xBFF00026 in
# int arrays; that is narrowing to C++11 compilers.
CPP_DEF_FLAGS += -Wno-narrowing

# jvm.make adds the C interpreter's GlobalDefinitions_c separately, which
# needs its own per-file include list - merged builds don't write one.
MERGE_SOURCE_FILES  = false
